var V={

home:function(){function th(n,k){var u=POSTERS[n]||STILLS[n];return '<span class="th'+(u?'':' ph0')+'"'+(u?' style="background-image:url('+u+')"':'')+'></span>'}

  var all=SC.dynamic.map(function(n){return r(n,'dynamic')}).concat(SC.static.map(function(n){return r(n,'static')}));
  all.sort(function(a,b){return /Electric/.test(b)-/Electric/.test(a)});
  return bar(null,'<button type="button" class="av" data-go="account" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>')+'<div class="col" style="padding-bottom:24px"><h1 class="h1" style="font-size:34px">Practice the<br>right call.</h1><p class="small" style="margin:0">Select a scenario</p><div class="list">'+all.join('')+'</div><p class="small" style="text-align:center;margin:6px 0 0">All scenarios are fictional. Does not replace department training or certification.</p></div>';},

scene:function(){var cl=CLIPS[S.name],land=window.innerWidth>window.innerHeight,src=cl&&(land?cl.landscape:cl.portrait);
  var si=(POSTERS[S.name]?{p:POSTERS[S.name],l:POSTERS[S.name]}:(SCENEIMG[S.name]||(STILLS[S.name]?{p:STILLS[S.name],l:STILLS[S.name]}:null))),media=src?'<video src="'+src+'" '+(cl.poster?'poster="'+cl.poster+'" ':'')+'autoplay muted loop playsinline'+((!land&&cl.portrait===cl.landscape)?' class="fit"':'')+'></video>':(si?'<div class="still" style="background-image:url('+(land?si.l:si.p)+')"></div>':'<div class="smoke"></div><div class="ph">'+S.name+' · approved clip goes here</div>');

  return '<div class="vid '+S.tone+(S.mode==='test'&&S.phase!=='study'?' tst':'')+'">'+media+hud+(S.mode==='test'&&S.phase!=='study'?'<button type="button" class="stbtn" id="stbtn">Incident status ▾</button>':'')+'<div class="pull'+(S.pull?' on':'')+'" id="pull">'+(function(){var t=S.tone==='bad'?1:S.tone==='good'?2:0,N=[['Holding','The fire is not spreading, but it is not under control yet. Your orders have not changed it.'],['Worsening','Conditions are getting worse. Give an order or call for more help.'],['Improving','Your orders are working. Keep going.']][t];return '<div class="k">Incident status</div><div class="v">'+N[0]+'</div><p class="stx">'+N[1]+'</p><div class="scale"><span class="'+(t===1?'on':'')+'">Worsening</span><span class="'+(t===0?'on':'')+'">Holding</span><span class="'+(t===2?'on':'')+'">Improving</span></div><div class="k" style="margin-top:12px">Based on what you have ordered. Swipe up to close.</div>';})()+'</div>'+(S.cue?'<div class="cue">'+S.cue+'</div>':'')+(S.ended?'':ind)+(S.ended?'<div style="position:absolute;inset:auto 0 0 0;padding:20px;background:linear-gradient(transparent,#000);z-index:6"><button type="button" class="btn" data-go="result">See result</button></div>':'')+'</div>';},
result:function(){var t=S.mode==='test';
  if(t){var F=[['Size-up',72,'Gave the type of fire, that a vehicle was involved, and that fire was showing.','Did not state the hazard: an electric vehicle battery can reignite and needs a large, continuous water supply.','Say the hazard out loud in your first report.'],['Strategy and tactics',58,'Chose a defensive position and kept crews out of the line of the vehicle.','Did not set a water supply early. The battery needed far more than first planned.','Ask for a water supply right after your first order.'],['Life, property, environment',84,'Confirmed no one was inside and protected the exposure next to the vehicle.','Did not mention runoff from the fire water.','Name all three: life, property, environment.'],['Fireground priorities',63,'Put life safety first.','Called for more help late, after the incident had already started to worsen.','Call for the next alarm as soon as the fire outgrows your first units.'],['Radio communication',77,'Clear, short radio reports.','Gave no progress report after the first order.','Report progress after every major order.']];

  return bar('home','<span class="pill on">learn</span>')+'<div class="col" style="padding-bottom:24px"><h2 class="h2">'+S.name+'</h2><div class="rv" data-go="scene" role="button" aria-label="Replay the scene"><div class="smoke"></div><span class="play">&#9654;</span><span class="rvl">'+S.name+' · scene replay</span></div><h1 class="h1" style="font-size:32px">Compare with the model size-up</h1><button type="button" class="btn">Hear the model size-up</button><button type="button" class="btn g" data-go="scene">Replay the scene</button><button type="button" class="btn g" data-go="list">Another scenario</button></div>';},
